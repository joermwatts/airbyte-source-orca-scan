documentationUrl: https://github.com/joermwatts/airbyte-source-orca-scan#readme
connectionSpecification:
  $schema: http://json-schema.org/draft-07/schema#
  title: Orca Scan Source Spec
  type: object
  required:
    - api_key
  additionalProperties: true
  properties:
    api_key:
      type: string
      title: API Key
      description: >-
        Your Orca Scan API key, which starts with `orca_`. Create one in the Orca Scan
        web app under Account Settings. API access requires an Orca Scan Business subscription.
      airbyte_secret: true
      order: 0
    start_date:
      type: string
      title: Start Date
      description: >-
        Optional. On the first incremental sync of sheet_history, only changes at or after this
        instant (UTC) are replicated. Leave blank to sync the full history. Rows are always
        synced in full - they carry no timestamp. Format: 2024-01-01T00:00:00Z.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}Z?)?$"
      pattern_descriptor: "YYYY-MM-DDTHH:mm:ssZ"
      examples:
        - "2024-01-01T00:00:00Z"
      format: date-time
      order: 1
