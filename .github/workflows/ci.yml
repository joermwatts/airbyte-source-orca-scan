name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Unit tests (live tests skip without ORCA_SCAN_API_KEY)
        run: poetry run pytest --cov=source_orca_scan --cov-report=term
      - name: Spec smoke test
        run: poetry run source-orca-scan spec | grep -q '"type":"SPEC"'

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t airbyte/source-orca-scan:dev .
      - name: Image emits spec
        run: docker run --rm airbyte/source-orca-scan:dev spec | grep -q '"type":"SPEC"'
