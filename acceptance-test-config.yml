# Airbyte Connector Acceptance Tests (CAT).
# Build the image first: docker build -t airbyte/source-orca-scan:dev .
# Then, from this directory:
#   docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/test_input" \
#     airbyte/connector-acceptance-test:latest --acceptance-test-config /test_input \
#     -k "not backward_compatibility"
# The backward-compatibility tests compare against the previously *published* image; until one
# exists on Docker Hub they error at fixture setup, so deselect them with -k as above.
# The catalogs and abnormal state under secrets/ are account-specific (they name the account's
# sheets) and are generated by scripts/make_cat_inputs.py; secrets/ is gitignored.
connector_image: airbyte/source-orca-scan:dev
test_strictness_level: low
acceptance_tests:
  spec:
    tests:
      - spec_path: source_orca_scan/spec.yaml
        # No earlier release to compare against yet.
        backward_compatibility_tests_config:
          disable_for_version: "0.1.0"
  connection:
    tests:
      - config_path: secrets/config.json
        status: succeed
      - config_path: secrets/bad_config.json
        status: failed
  discovery:
    tests:
      - config_path: secrets/config.json
        timeout_seconds: 120
        backward_compatibility_tests_config:
          disable_for_version: "0.1.0"
  basic_read:
    tests:
      - config_path: secrets/config.json
        configured_catalog_path: secrets/configured_catalog_cat.json
        validate_schema: true
        empty_streams:
          - name: sheet_hooks
            bypass_reason: The test account has no webhooks registered on any sheet.
        timeout_seconds: 1200
  full_refresh:
    tests:
      - config_path: secrets/config.json
        configured_catalog_path: secrets/configured_catalog_cat.json
        timeout_seconds: 2400
  incremental:
    tests:
      - config_path: secrets/config.json
        configured_catalog_path: secrets/configured_catalog_cat_incremental.json
        future_state:
          future_state_path: secrets/abnormal_state.json
        timeout_seconds: 2400
